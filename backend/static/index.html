<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESCAP Trade Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- Nav -->
<nav class="bg-slate-900 text-white px-6 py-3 flex items-center gap-8">
  <span class="font-semibold tracking-wide text-sm">ESCAP Trade Analyzer</span>
  <a href="/" class="text-sm text-white font-medium border-b border-white pb-0.5">Dashboard</a>
  <a href="/upload.html" class="text-sm text-slate-400 hover:text-white transition-colors">Upload</a>
  <a href="/chat.html" class="text-sm text-slate-400 hover:text-white transition-colors">Chat</a>
</nav>

<main x-data="dashboard()" x-init="init()" class="max-w-5xl mx-auto px-6 py-8">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Document Library</h1>
      <p class="text-sm text-slate-500 mt-0.5">Upload regulatory PDFs, review extractions, then query via the chatbot.</p>
    </div>
    <a href="/upload.html"
       class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">
      + Upload Document
    </a>
  </div>

  <!-- Stats bar -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-lg border border-slate-200 p-4">
      <p class="text-xs text-slate-500 uppercase tracking-wide">Documents</p>
      <p class="text-2xl font-semibold text-slate-900 mt-1" x-text="documents.length"></p>
    </div>
    <div class="bg-white rounded-lg border border-slate-200 p-4">
      <p class="text-xs text-slate-500 uppercase tracking-wide">Pending Review</p>
      <p class="text-2xl font-semibold text-amber-600 mt-1" x-text="totalPending"></p>
    </div>
    <div class="bg-white rounded-lg border border-slate-200 p-4">
      <p class="text-xs text-slate-500 uppercase tracking-wide">Indexed Provisions</p>
      <p class="text-2xl font-semibold text-green-700 mt-1" x-text="totalAccepted"></p>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="text-center py-16 text-slate-400 text-sm">Loading documents…</div>

  <!-- Empty state -->
  <div x-show="!loading && documents.length === 0"
       class="text-center py-20 bg-white rounded-xl border border-slate-200">
    <p class="text-slate-400 text-sm">No documents yet.</p>
    <a href="/upload.html" class="mt-3 inline-block text-blue-600 text-sm hover:underline">Upload your first document</a>
  </div>

  <!-- Error -->
  <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4" x-text="error"></div>

  <!-- Document list -->
  <div class="space-y-3">
    <template x-for="doc in documents" :key="doc.id">
      <div class="bg-white rounded-xl border border-slate-200 p-5 flex items-start gap-4 hover:shadow-sm transition-shadow">

        <!-- Icon -->
        <div class="flex-shrink-0 w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>

        <!-- Info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <p class="font-medium text-slate-900 text-sm truncate" x-text="doc.filename"></p>
            <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                  :class="statusBadgeClass(doc.status)"
                  x-text="labelStatus(doc.status)"></span>
          </div>

          <div class="flex items-center gap-4 mt-1 text-xs text-slate-500 flex-wrap">
            <span x-show="doc.doc_metadata.country" x-text="doc.doc_metadata.country"></span>
            <span x-show="doc.doc_metadata.treaty_name" x-text="doc.doc_metadata.treaty_name"></span>
            <span x-show="doc.total_pages > 0" x-text="`${doc.total_pages} pages`"></span>
            <span x-text="formatDate(doc.created_at)"></span>
          </div>

          <div x-show="doc.status === 'error'" class="mt-1 text-xs text-red-600" x-text="doc.error_message"></div>

          <!-- Progress -->
          <div x-show="doc.extraction_count > 0" class="flex items-center gap-3 mt-2 text-xs text-slate-500">
            <span x-text="`${doc.extraction_count} extractions`"></span>
            <span x-show="doc.pending_count > 0" class="text-amber-600 font-medium" x-text="`${doc.pending_count} pending`"></span>
            <span x-show="doc.accepted_count > 0" class="text-green-600 font-medium" x-text="`${doc.accepted_count} indexed`"></span>
          </div>

          <!-- Spinner for in-progress docs -->
          <div x-show="['processing','extracting'].includes(doc.status)" class="flex items-center gap-1.5 mt-2">
            <svg class="animate-spin w-3.5 h-3.5 text-blue-500" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
            <span class="text-xs text-blue-600">Processing with AI…</span>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 flex-shrink-0">
          <a x-show="doc.status === 'parsed'"
             :href="`/review.html?id=${doc.id}`"
             class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 transition-colors font-medium">
            Review
          </a>
          <button @click="remove(doc.id)"
                  class="text-xs text-slate-400 hover:text-red-500 transition-colors px-2 py-1.5">
            Delete
          </button>
        </div>
      </div>
    </template>
  </div>
</main>

<script>
function dashboard() {
  return {
    documents: [],
    loading: true,
    error: null,
    pollTimer: null,

    get totalPending() { return this.documents.reduce((s, d) => s + d.pending_count, 0); },
    get totalAccepted() { return this.documents.reduce((s, d) => s + d.accepted_count, 0); },

    async init() {
      await this.load();
      this.loading = false;
      this.pollTimer = setInterval(() => this.pollActive(), 4000);
    },

    async load() {
      try { this.documents = await getDocuments(); }
      catch (e) { this.error = e.message; }
    },

    async pollActive() {
      const active = this.documents.filter(d => ['processing','extracting'].includes(d.status));
      if (!active.length) return;
      for (const d of active) {
        try {
          const updated = await getDocument(d.id);
          const idx = this.documents.findIndex(x => x.id === d.id);
          if (idx >= 0) this.documents[idx] = updated;
        } catch {}
      }
    },

    async remove(id) {
      if (!confirm('Delete this document and all its extractions?')) return;
      try {
        await deleteDocument(id);
        this.documents = this.documents.filter(d => d.id !== id);
      } catch (e) { alert(e.message); }
    },

    statusBadgeClass, labelStatus, formatDate,
  };
}
</script>
</body>
</html>
